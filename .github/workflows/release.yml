name: Release

# Push a version tag (git tag v0.2.0 && git push --tags) to build installers for
# macOS, Windows and Linux and attach them to a draft GitHub Release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and upload installers
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Builds are unsigned until signing certificates are added as secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
