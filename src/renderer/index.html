<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>ClipVault</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- History view -->
      <section id="view-history" class="view">
        <header class="top">
          <div class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <input
              id="search"
              type="text"
              aria-label="Search clips"
              placeholder="Search clips…"
              autocomplete="off"
              spellcheck="false"
            />
            <span id="paused-badge" class="badge" hidden>Paused</span>
          </div>
          <nav class="tabs" role="tablist">
            <button class="tab active" type="button" data-filter="all" role="tab" aria-selected="true">
              All <span id="count-all">0</span>
            </button>
            <button class="tab" type="button" data-filter="pinned" role="tab" aria-selected="false">
              Pinned <span id="count-pinned">0</span>
            </button>
            <span class="spacer"></span>
            <button id="open-settings" class="icon-btn" type="button" title="Settings" aria-label="Settings">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
                />
              </svg>
            </button>
          </nav>
        </header>

        <ul id="list" class="list" role="listbox" aria-label="Clipboard history"></ul>

        <div id="empty" class="empty" hidden>
          <p id="empty-title" class="empty-title">Nothing here yet</p>
          <p id="empty-sub" class="empty-sub">Copy text in any app and it shows up here.</p>
        </div>

        <footer class="hints">
          <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
          <span><kbd>↵</kbd> <b id="enter-label">paste</b></span>
          <span><kbd>⇧↵</kbd> copy</span>
          <span><kbd class="mod">⌘</kbd><kbd>P</kbd> pin</span>
          <span><kbd class="mod">⌘</kbd><kbd>⌫</kbd> delete</span>
          <span><kbd>esc</kbd> close</span>
        </footer>
      </section>

      <!-- Settings view -->
      <section id="view-settings" class="view" hidden>
        <header class="settings-head">
          <button id="close-settings" class="icon-btn" type="button" title="Back" aria-label="Back to clips">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
          </button>
          <h1>Settings</h1>
        </header>

        <div class="settings">
          <label class="row">
            <span class="row-text"><b>Open shortcut</b><small>Click, then press the keys you want</small></span>
            <input id="set-hotkey" class="hotkey" readonly />
          </label>
          <label class="row">
            <span class="row-text"
              ><b>History size</b><small>Unpinned clips kept. Pinned clips are never removed.</small></span
            >
            <input id="set-limit" type="number" min="10" max="5000" step="10" />
          </label>
          <label class="row">
            <span class="row-text"
              ><b>Paste after selecting</b><small>Enter pastes straight into the app you were using</small></span
            >
            <input id="set-paste" type="checkbox" class="switch" />
          </label>
          <label class="row">
            <span class="row-text"><b>Pause capture</b><small>Stop recording new copies</small></span>
            <input id="set-paused" type="checkbox" class="switch" />
          </label>
          <label class="row">
            <span class="row-text"><b>Launch at login</b><small>Start ClipVault when you sign in</small></span>
            <input id="set-login" type="checkbox" class="switch" />
          </label>
          <label class="row">
            <span class="row-text"
              ><b>Skip blank clips</b><small>Ignore copies that are only spaces or newlines</small></span
            >
            <input id="set-whitespace" type="checkbox" class="switch" />
          </label>
          <div class="row">
            <span class="row-text"><b>Clear history</b><small>Removes every unpinned clip</small></span>
            <button id="clear-history" class="danger" type="button">Clear</button>
          </div>
          <p id="settings-msg" class="settings-msg" role="status"></p>
        </div>
      </section>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
